name = "pm-feedback"
main = "worker/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# React SPA served for all non-API routes
[assets]
directory = "./dist"
not_found_handling = "single-page-application"

# D1 — source of truth
# After running: npx wrangler d1 create pm-feedback-db
# paste the database_id below
[[d1_databases]]
binding = "DB"
database_name = "pm-feedback-db"
database_id = "9edc4b88-55e8-412f-8f2c-eb3f2eb045d6"

# Vectorize v2 — 384 dims to match @cf/baai/bge-base-en-v1.5
# After running: npx wrangler vectorize create pm-feedback-embeddings --dimensions=384 --metric=cosine
[[vectorize]]
binding = "VECTORIZE"
index_name = "pm-feedback-embeddings"

# Workers AI
[ai]
binding = "AI"

# Workflows — async analysis orchestration
[[workflows]]
name = "pm-feedback-analyze"
binding = "ANALYZE_WORKFLOW"
class_name = "AnalyzeWorkflow"

[dev]
port = 8787
